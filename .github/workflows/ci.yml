name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gamma
          POSTGRES_USER: gamma
          POSTGRES_PASSWORD: gamma-ci-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamma -d gamma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.11.3
        ports:
          - 6333:6333
      minio:
        image: minio/minio:RELEASE.2024-07-16T23-46-41Z
        env:
          MINIO_ROOT_USER: gamma-ci-${{ github.run_id }}
          MINIO_ROOT_PASSWORD: gamma-ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall apps packages scripts tests
      - run: ruff check .
      - run: mypy .
      - run: pytest
      - run: python scripts/validate_foundation.py
      - run: pip-audit
