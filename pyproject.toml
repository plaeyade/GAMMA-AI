[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamma-foundation"
version = "0.1.0"
description = "GAMMA Knowledge Engine Foundation Sprint 001"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "boto3>=1.34,<2.0",
  "qdrant-client>=1.10,<2.0",
  "opentelemetry-api>=1.25,<2.0",
  "opentelemetry-sdk>=1.25,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.10,<2.0",
  "pip-audit>=2.7,<3.0",
  "pre-commit>=3.7,<4.0",
]

[project.scripts]
gamma = "gamma_cli.main:main"
gamma-worker = "gamma_worker.main:main"

[tool.setuptools.packages.find]
where = [
  "apps/api",
  "apps/worker",
  "apps/cli",
  "packages/core",
  "packages/config",
  "packages/domain",
  "packages/observability",
  "packages/storage",
  "packages/persistence",
]
include = ["gamma_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
  "apps/api",
  "apps/worker",
  "apps/cli",
  "packages/core",
  "packages/config",
  "packages/domain",
  "packages/observability",
  "packages/storage",
  "packages/persistence",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "apps/api",
  "apps/worker",
  "apps/cli",
  "packages/core",
  "packages/config",
  "packages/domain",
  "packages/observability",
  "packages/storage",
  "packages/persistence",
]
