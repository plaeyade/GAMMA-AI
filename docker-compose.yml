services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gamma
      POSTGRES_USER: gamma
      POSTGRES_PASSWORD: ${GAMMA_POSTGRES_PASSWORD:?set GAMMA_POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamma -d gamma"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${GAMMA_MINIO_ROOT_USER:?set GAMMA_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${GAMMA_MINIO_ROOT_PASSWORD:?set GAMMA_MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
